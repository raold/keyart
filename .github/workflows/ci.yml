name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A newer run for the same ref supersedes the one in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo. The image job raises its own.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    # The Electron binary isn't needed to typecheck/build, and its postinstall is
    # unreliable under Node 22 - skip the download for a fast, deterministic CI.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm install` (not `npm ci`): the committed lockfile is generated on
      # Windows and omits a few Linux-only transitive optional deps (@emnapi/*),
      # which makes the stricter `npm ci` fail on the Linux runner. `npm install`
      # resolves them cleanly. (The Docker build does the same for this reason.)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck renderer
        run: npx tsc --noEmit

      - name: Typecheck main process
        run: npx tsc -p tsconfig.electron.json --noEmit

      # The web/server build (used by the Docker image) imports deps like
      # @fastify/static that the renderer/main typechecks don't cover, so
      # check it here too - this is the path a server dependency bump breaks.
      - name: Typecheck server
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npx vite build

      - name: Build main process
        run: npx tsc -p tsconfig.electron.json

  # Publishes ghcr.io/<owner>/keyart for every push that passes CI: sha-<7>
  # (what the server deploys), edge on main, and X.Y + latest on a vX.Y tag,
  # which also gets a GitHub Release. Pull requests never publish.
  image:
    name: Publish image
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # Build from a checkout of this exact commit (the action's default Git
      # context follows the branch tip, which can move under a queued run).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The match tag below would add `latest` on its own; the explicit
          # raw tag is the single source, so it isn't listed twice.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: KEYART_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
